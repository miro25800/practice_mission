# 261118 개인 과제용 PostgreSQL
name: 261118_dailymission

services:
  db:
    container_name: 261118_dailymission-db
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: admin1234
      POSTGRES_DB: 261118_dailymission
    ports:
      - "5434:5432"
    volumes:
      - 261118_dailymission_pgdata:/var/lib/postgresql

volumes:
  261118_dailymission_pgdata: